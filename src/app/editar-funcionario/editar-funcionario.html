<div class="p-4 bg-gray-100 min-h-screen flex flex-col items-center">
  
  
  <div class="w-full max-w-md bg-white rounded shadow overflow-hidden">
    
   
    <div class="bg-gradient-to-l from-gray-600 to-blue-500 text-white p-4 text-center">
      <h1 class="text-xl font-bold uppercase tracking-wide">Actualizar Funcionario</h1>
    </div>

  
    <form (ngSubmit)="actualizarFuncionario()" class="p-6 flex flex-col gap-3">

      
      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">ID Funcionario</label>
        <input 
          type="text"
          placeholder="Escribe id" 
          name="id" 
          [(ngModel)]="funcionario.id_funcionario"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500 bg-gray-50"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Cédula / Identificación</label>
        <input 
          type="text"
          placeholder="Escribe tu identificacion" 
          name="ident" 
          [(ngModel)]="funcionario.ci"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Apellidos</label>
        <input 
          type="text"
          placeholder="Escribe tu apellido" 
          name="ape" 
          [(ngModel)]="funcionario.apellidos"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

     
      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Nombres</label>
        <input 
          type="text"
          placeholder="Escribe tu nombre" 
          name="nom" 
          [(ngModel)]="funcionario.nombres"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      
      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Tipo de Funcionario</label>
        <input 
          type="text"
          placeholder="Tipo de funcionario" 
          name="funcio" 
          [(ngModel)]="funcionario.tipo_funcionario"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      
      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Teléfono</label>
        <input 
          type="text"
          placeholder="Escribe tu telefono" 
          name="tel" 
          [(ngModel)]="funcionario.telefono"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      
      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Correo Electrónico</label>
        <input 
          type="email"
          placeholder="Escribe tu correo" 
          name="corr" 
          [(ngModel)]="funcionario.correo"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

     
      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Dirección</label>
        <input 
          type="text"
          placeholder="Escribe tu direccion" 
          name="dir" 
          [(ngModel)]="funcionario.direccion"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      
      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Sexo</label>
        <input 
          type="text"
          placeholder="Escribe tu sexo" 
          name="sex" 
          [(ngModel)]="funcionario.sexo"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      
      <div class="mt-3">
        <button 
          type="submit" 
          class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded text-sm transition-colors shadow">
          Actualizar
        </button>
      </div>

    </form>
  </div>

</div>
