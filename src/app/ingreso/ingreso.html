<h2>Lista de Ingresos</h2>

<table border="1">

  <thead>

    <tr>
      <th>ID Ingreso</th>
      <th>Fecha Ingreso</th>
      <th>Fecha Salida</th>
      <th>Estado</th>
      <th>ID Usuario</th>
      <th>Acciones</th>
    </tr>

  </thead>

  <tbody>

    <tr *ngFor="let ingreso of ingresos">

      <td>
        {{ ingreso.id_ingreso }}
      </td>

      <td>
        {{ ingreso.fecha_ingreso }}
      </td>

      <td>
        {{ ingreso.fecha_salida }}
      </td>

      <td>
        {{ ingreso.estado }}
      </td>

      <td>
        {{ ingreso.id_usuario }}
      </td>

      <td>

        <button
          (click)="eliminarIngreso(ingreso.id_ingreso)">
          Eliminar
        </button>

      </td>

    </tr>

  </tbody>

</table>
