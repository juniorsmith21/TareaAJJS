<h2>Lista de Ingresos</h2>

<table border="1">

<tr>
  <th>Id</th>
 
  <th style="width: 200px;">Fecha Ingreso</th>
  
  <th style="width: 200px;">Fecha Salida</th>
 
 
  <th style="width: 200px;">Estado</th>
  
  <th style="width: 200px;">Usuario</th>
  
</tr>

<tr *ngFor = "let i of ingresos">

  <td>{{i.id_ingreso}}</td>

  <td>{{i.fecha_ingreso}}</td>
 
  <td>{{i.fecha_salida}}</td>

  <td>{{i.estado}}</td>
 
  <td >{{i.id_usuario}}</td>

</tr>

</table>
