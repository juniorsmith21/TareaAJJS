<div class="p-4 bg-gray-100 min-h-screen flex flex-col items-center">
  
  <div class="w-full max-w-md bg-white rounded shadow overflow-hidden">
    
    <div class="bg-gradient-to-l from-gray-600 to-blue-500 text-white p-4 text-center">
      <h1 class="text-xl font-bold uppercase tracking-wide">Actualizar Bitácora</h1>
    </div>

    <form (ngSubmit)="actualizarBitacora()" class="p-6 flex flex-col gap-3">

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">ID Bitácora</label>
        <input 
          type="text"
          placeholder="Escribe id bitacora" 
          name="id" 
          [(ngModel)]="bitacora.id_bitacora"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500 bg-gray-50"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Operación</label>
        <input 
          type="text"
          placeholder="Escribe operacion" 
          name="operacion" 
          [(ngModel)]="bitacora.operacion"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Tabla</label>
        <input 
          type="text"
          placeholder="Escribe tabla" 
          name="tabla" 
          [(ngModel)]="bitacora.tabla"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Fecha</label>
        <input 
          type="text"
          placeholder="Escribe fecha" 
          name="fecha" 
          [(ngModel)]="bitacora.fecha"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Sintaxis SQL</label>
        <input 
          type="text"
          placeholder="Escribe sintaxis sql" 
          name="sintaxis" 
          [(ngModel)]="bitacora.sintaxis_sql"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Nombre SQL</label>
        <input 
          type="text"
          placeholder="Escribe nombre sql" 
          name="nombre_sql" 
          [(ngModel)]="bitacora.nombre_sql"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">ID Usuario</label>
        <input 
          type="text"
          placeholder="Escribe id usuario" 
          name="id_usr" 
          [(ngModel)]="bitacora.id_usuario"
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="mt-3">
        <button 
          type="submit" 
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded text-sm transition-colors shadow">
          Actualizar
        </button>
      </div>

    </form>
  </div>

</div>
