<h1>Actualizar Bitácoraaaa</h1>

<form (ngSubmit)="actualizarBitacora()">

    <input placeholder="Escribe id bitacora" name="id" [(ngModel)]="bitacora.id_bitacora">

    <input placeholder="Escribe operacion" name="operacion" [(ngModel)]="bitacora.operacion">

    <input placeholder="Escribe tabla" name="tabla" [(ngModel)]="bitacora.tabla">

    <input placeholder="Escribe fecha" name="fecha" [(ngModel)]="bitacora.fecha">

    <input placeholder="Escribe sintaxis sql" name="sintaxis" [(ngModel)]="bitacora.sintaxis_sql">

    <input placeholder="Escribe nombre sql" name="nombre_sql" [(ngModel)]="bitacora.nombre_sql">

    <input placeholder="Escribe id usuario" name="id_usr" [(ngModel)]="bitacora.id_usuario">

    <button type="submit"> Actualizar </button>

</form>
