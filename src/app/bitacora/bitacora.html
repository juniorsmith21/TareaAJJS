<div class="p-4 bg-gray-100 min-h-screen flex flex-col items-center">
  
  <div class="w-full max-w-5xl bg-white rounded shadow overflow-hidden">
    
    <div class="bg-gradient-to-l from-gray-600 to-blue-500 text-white p-4 text-center">
      <h1 class="text-xl font-bold uppercase tracking-wide">Lista de Bitácora</h1>
    </div>

    <div class="overflow-x-auto p-4">
      <table class="w-full text-left border-collapse">

        <thead>
          <tr class="bg-gray-200 text-gray-700 uppercase text-xs tracking-wider border-b border-gray-300">
            <th class="p-3">ID</th>
            <th class="p-3">Operación</th>
            <th class="p-3">Tabla</th>
            <th class="p-3">Fecha</th>
            <th class="p-3">Sintaxis SQL</th>
            <th class="p-3">Nombre SQL</th>
            <th class="p-3">ID Usuario</th>
            <th class="p-3 text-center">Acciones</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-200 text-sm text-gray-700">
          <tr *ngFor="let b of bitacora" class="hover:bg-gray-50 transition-colors">
            
            <td class="p-3 font-medium text-gray-900">{{ b.id_bitacora }}</td>
            <td class="p-3">{{ b.operacion }}</td>
            <td class="p-3">{{ b.tabla }}</td>
            <td class="p-3">{{ b.fecha }}</td>
            <td class="p-3 max-w-xs truncate" [title]="b.sintaxis_sql">{{ b.sintaxis_sql }}</td>
            <td class="p-3">{{ b.nombre_sql }}</td>
            <td class="p-3">{{ b.id_usuario }}</td>

            <td class="p-3 text-center space-x-2 whitespace-nowrap">
              <button 
                (click)="llevarActualizar(b.id_bitacora)"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1 rounded text-xs transition-colors shadow">
                Actualizar
              </button>

              <button 
                (click)="eliminar(b.id_bitacora)"
                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-3 py-1 rounded text-xs transition-colors shadow">
                Eliminar
              </button>
            </td>

          </tr>
        </tbody>

      </table>
    </div>

  </div>

</div>
