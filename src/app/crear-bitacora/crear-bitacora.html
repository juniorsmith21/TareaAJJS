<div class="p-4 bg-gray-100 min-h-screen flex flex-col items-center">
  
  <div class="w-full max-w-md bg-white rounded shadow overflow-hidden">
    
    <div class="bg-gradient-to-l from-gray-600 to-blue-500 text-white p-4 text-center">
      <h1 class="text-xl font-bold uppercase tracking-wide">Crear Bitácora</h1>
    </div>

    <form (ngSubmit)="guardarBitacora()" class="p-6 flex flex-col gap-3">

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Operación</label>
        <input 
          type="text"
          placeholder="Escribe la operación" 
          name="operacion" 
          [(ngModel)]="nuevaBitacora.operacion"
          required
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Tabla</label>
        <input 
          type="text"
          placeholder="Escribe el nombre de la tabla" 
          name="tabla" 
          [(ngModel)]="nuevaBitacora.tabla"
          required
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Fecha</label>
        <input 
          type="datetime-local"
          name="fecha" 
          [(ngModel)]="nuevaBitacora.fecha"
          required
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500 text-gray-700"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Sintaxis SQL</label>
        <textarea 
          rows="4"
          placeholder="Escribe la sintaxis SQL"
          name="sintaxis_sql" 
          [(ngModel)]="nuevaBitacora.sintaxis_sql"
          required
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        ></textarea>
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Nombre SQL</label>
        <input 
          type="text"
          placeholder="Escribe el nombre SQL" 
          name="nombre_sql" 
          [(ngModel)]="nuevaBitacora.nombre_sql"
          required
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500"
        >
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-semibold text-gray-600 mb-1">Usuario</label>
        <select 
          name="id_usuario" 
          [(ngModel)]="nuevaBitacora.id_usuario"
          required
          class="border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-blue-500 bg-white"
        >
          <option value="">Seleccione un usuario</option>
          <option *ngFor="let usuario of usuarios" [value]="usuario.id_usuario">
            {{usuario.id_usuario}}
          </option>
        </select>
      </div>

      <div class="mt-3">
        <button 
          type="submit" 
          class="w-full bg-green-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded text-sm transition-colors shadow">
          Guardar Bitácora
        </button>
      </div>

    </form>
  </div>

</div>
